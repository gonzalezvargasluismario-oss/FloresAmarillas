<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Una sorpresa para vos 🌻</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- =========================================
         PANTALLA INICIAL
         ========================================= -->

    <section class="inicio" id="inicio">

        <div class="contenido-inicio">

            <p class="pequeno">
                Tengo algo preparado para vos...
            </p>

            <h1>
                Una pequeña sorpresa 🌻
            </h1>

            <p class="subtitulo">
                Porque algunas personas merecen
                recibir algo bonito.
            </p>

            <button id="btnAbrir">
                Abrir sorpresa
            </button>

        </div>

    </section>


    <!-- =========================================
         ESCENA PRINCIPAL
         ========================================= -->

    <section class="escena" id="escena">

        <!-- Luna -->

        <div class="luna"></div>


        <!-- Estrellas -->

        <div id="estrellas"></div>


        <!-- Partículas -->

        <div id="particulas"></div>


        <!-- Pétalos -->

        <div id="petalos"></div>


        <!-- Jardín -->

        <div class="jardin">

            <div class="pasto"></div>

            <div id="flores"></div>

        </div>


        <!-- Mensaje -->

        <div class="mensaje">

            <h2>
                Estas flores son para la ingeniera mas guapa 🌻
            </h2>

            <p>
                Espero que te saquen una sonrisa.
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
